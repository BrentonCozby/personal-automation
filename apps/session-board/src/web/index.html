<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sessions</title>
    <style>
      /* One palette, so the board stays dark on a machine set to light. Every
         color that carries text clears 4.5:1 against `--bg`. `faint`, `idle`
         and `gone` never carry text, and clear the 3:1 a dot or an edge needs. */
      :root {
        color-scheme: dark;
        --bg: #0e0e0e;
        --fg: #e8e6e3;
        --muted: #837e79;
        --faint: #68625c;
        /* Rows carry a second line only sometimes, so the separator is what
           says where one ends. At #1f1f1f it was there but not visible, which
           let a two-line row read as two rows. */
        --hairline: #302c29;
        --hover: #191919;
        --running: #4ec46f;
        --waiting: #e0a318;
        /* Two tokens holding one value: the dot only has to clear 3:1 where the
           name beside it needs 4.5:1, and this amber clears both. */
        --waiting-mark: #e0a318;
        --ready: #4d9df0;
        --idle: #6b665f;
        --gone: #68625b;
        --danger: #f0664c;
        /* The status mark's box, and the gap after it. `.sub` adds the two to
           line its second line up under the name. */
        --mark: 9px;
        --mark-gap: 8px;
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0 auto;
        /* A row pairs a name on the left with its age on the right, and the pair
           stops reading as one thing once they are far apart: in a full-width
           window they ended up 1714px away from each other. This is a side
           panel, so it keeps panel width whatever window it lands in. */
        max-width: 560px;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }

      /* Nothing here is reachable by keyboard by accident: the rows are divs, so
         each control opts in with a tabindex and every one of them shows this. */
      :focus-visible {
        outline: 2px solid var(--ready);
        outline-offset: 1px;
        border-radius: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }

      #toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        font-size: 11px;
        color: var(--muted);
        border-bottom: 1px solid var(--hairline);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 2;
      }

      /* Says the board stopped updating, which it otherwise cannot: every row
         goes on reading as whatever it said when the stream died. Empty and so
         drawn as nothing while the stream is up. */
      #offline {
        color: var(--danger);
        font-weight: 600;
      }

      #offline:not(:empty)::before {
        content: '';
        display: inline-block;
        width: var(--mark);
        height: var(--mark);
        margin-right: 6px;
        border-radius: 50%;
        background: var(--danger);
        vertical-align: -1px;
      }

      /* A band, and a label rather than a title. A group header used to be the
         same `--fg` white as an idle session's name at a one-pixel size
         difference, so the two read as the same kind of thing. It now differs
         by background, case, size and color at once, which is what keeps the
         session names the brightest thing on the board. */
      .group-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        margin-top: 10px;
        background: var(--hover);
        border-top: 1px solid var(--hairline);
        border-bottom: 1px solid var(--hairline);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        user-select: none;
      }

      .chevron-hit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        /* The triangle is a few pixels across. This is the box you actually
           click, held at the 24px a pointer target needs. */
        width: 24px;
        height: 24px;
        margin-left: -7px;
        border-radius: 3px;
        cursor: pointer;
      }

      .chevron-hit:hover { background: var(--hover); }

      .group-header .count { color: var(--muted); font-weight: 400; flex: none; }

      /* A long group name shortens itself rather than pushing its count off the
         panel. */
      .group-label {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* The rename field is typed in, so it keeps sentence case and a readable
         size while the label around it is a small uppercase one. */
      .group-header input.edit {
        text-transform: none;
        letter-spacing: normal;
        font-size: 12px;
      }

      .group-header .group-name { border-radius: 3px; cursor: text; }
      .group-header .group-name:hover { box-shadow: inset 0 0 0 1px var(--hairline); }

      /* Drawn only while the header is hovered or holds focus: a column of
         always-on delete buttons down a board of eight groups is noise you can
         catch with the pointer on the way past. The `+` ahead of it takes the
         free space, so the two sit together at the right edge; a second
         `margin-left: auto` here would split that space and strand the `+` in
         the middle of the header. */
      .group-delete {
        flex: none;
        display: none;
        background: var(--bg);
        border: 1px solid var(--faint);
        color: var(--muted);
        border-radius: 4px;
        font-family: inherit;
        font-size: 10px;
        letter-spacing: normal;
        text-transform: none;
        /* 24px each way, which is the smallest a pointer target should be. The
           × on its own is narrower than that. */
        min-height: 24px;
        min-width: 24px;
        line-height: 1;
        padding: 0 7px;
        cursor: pointer;
      }

      .group-header:hover .group-delete,
      .group-header:focus-within .group-delete { display: block; }

      .group-delete:hover { color: var(--danger); border-color: var(--danger); }

      /* The `+` that starts a session in this group. It takes the free space so
         it lands beside the ×, and it is hidden until hover for the same reason
         the × is: a column of always-on buttons down eight groups is noise. */
      .group-start {
        margin-left: auto;
        flex: none;
        display: none;
        background: var(--bg);
        border: 1px solid var(--faint);
        color: var(--muted);
        border-radius: 4px;
        font-family: inherit;
        font-size: 12px;
        letter-spacing: normal;
        text-transform: none;
        min-height: 24px;
        min-width: 24px;
        line-height: 1;
        padding: 0 7px;
        cursor: pointer;
      }

      .group-header:hover .group-start,
      .group-header:focus-within .group-start { display: block; }

      .group-start:hover { color: var(--fg); border-color: var(--ready); }

      .new-group {
        border-radius: 3px;
        padding: 2px 4px;
        cursor: pointer;
      }

      .new-group:hover { color: var(--fg); box-shadow: inset 0 0 0 1px var(--hairline); }

      /* Drawn rather than typed. The small-triangle characters render far below
         the label they sit next to whatever the font-size, and the full-size
         ones come out as emoji in some fonts. Borders in em scale with the
         header and look the same everywhere. */
      .chevron {
        flex: none;
        width: 0;
        height: 0;
        border-left: 0.32em solid transparent;
        border-right: 0.32em solid transparent;
        border-top: 0.38em solid var(--faint);
        transition: transform 0.12s;
      }

      .collapsed .chevron { transform: rotate(-90deg); }

      .row {
        padding: 6px 12px 6px 28px;
        border-top: 0.5px solid var(--hairline);
        position: relative;
      }

      .row:hover { background: var(--hover); }

      /* `grab` only on hover: a row is draggable everywhere, but showing the
         hand over the whole board would suggest the page itself moves. */
      .row:hover { cursor: grab; }
      .row:active { cursor: grabbing; }
      .row.dragging { opacity: 0.4; }

      /* The drop lands on the group, so the whole group lights up rather than a
         thin line between two rows: there is no ordering within a group to
         aim at, only which group you end up in. */
      .group.drop-target {
        background: var(--hover);
        box-shadow: inset 0 0 0 1px var(--ready);
        border-radius: 4px;
      }

      /* Drawn only in a group with no sessions, where the header would
         otherwise be the whole drop target. Dashed, so it reads as somewhere to
         put something rather than as a row that is already there. */
      .drop-hint {
        margin: 6px 12px 8px;
        padding: 11px;
        border: 1px dashed var(--faint);
        border-radius: 4px;
        text-align: center;
        font-size: 11px;
        color: var(--muted);
      }

      .group.drop-target .drop-hint { border-color: var(--ready); border-style: solid; }

      .row-top { display: flex; align-items: center; gap: var(--mark-gap); }

      /* Each status draws a different shape. Six pixels left room for hue and
         nothing else, and in light mode hue was carrying it alone: all five
         colors landed between 3.2:1 and 4.8:1 against the page, so the five
         dots were the same darkness and only told apart by looking straight at
         them. Nine pixels is enough for a shape to read at a glance. */
      .dot {
        width: var(--mark);
        height: var(--mark);
        border-radius: 50%;
        flex: none;
      }

      /* Working. The only solid one. */
      .status-running .dot { background: var(--running); }

      /* Waiting for you. The one shape that is not a circle, because it is the
         only status that asks you to do something. */
      .status-waiting .dot {
        border-radius: 0;
        background: var(--waiting-mark);
        clip-path: polygon(50% 0, 100% 92%, 0 92%);
      }

      /* Just went idle: half filled, between running's solid and idle's ring. */
      .status-ready .dot {
        background: linear-gradient(90deg, var(--ready) 0 50%, transparent 50%);
        box-shadow: inset 0 0 0 1.5px var(--ready);
      }

      /* Idle: an empty ring. */
      .status-idle .dot {
        background: none;
        box-shadow: inset 0 0 0 1.5px var(--idle);
      }

      /* Not running: a dash, which is an absence rather than a state a ring
         could hold. It has to be the quietest mark on the board, not the
         loudest, because most rows are `gone` most of the time: eleven of the
         sixteen here, and a column of eleven crosses read as eleven errors. */
      .status-gone .dot {
        border-radius: 0;
        background: linear-gradient(var(--gone) 0 0) center / 55% 1.5px no-repeat;
      }

      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: text;
        border-radius: 3px;
      }

      .name:hover { box-shadow: inset 0 0 0 1px var(--hairline); }
      .name.unnamed { color: var(--waiting); font-style: italic; }
      /* Same mark a progress file that has gone missing gets: what this row
         points at is no longer on disk. */
      .name.missing { text-decoration: line-through; text-decoration-thickness: 1px; }

      /* All five are written out, including the plain one. While `idle` had no
         rule it fell through to `--fg`, which made a session doing nothing the
         highest-contrast name on the board. */
      .status-running .name { color: var(--running); }
      .status-waiting .name { color: var(--waiting); }
      .status-ready   .name { color: var(--ready); }
      .status-idle    .name { color: var(--fg); }

      /* The three that are still yours to act on, and the only three carrying a
         hue. Weight says so a second way, for a reader who cannot separate
         them by color. */
      .status-running .name,
      .status-waiting .name,
      .status-ready   .name { font-weight: 600; }
      /* `muted`, not `faint`: this is the name of the session, so it has to be
         readable even while the row is the quietest thing on the board. */
      .status-gone    .name { color: var(--muted); }

      /* A name read out of the session rather than typed by anyone. Italic like
         `unnamed`, for the same reason, but in the row's own color: amber is
         the drawer asking to be named, and this row already says what it is.
         Last, so it outranks the weight the three live statuses set. */
      .name.derived { font-style: italic; font-weight: 400; }

      .age {
        font-size: 11px;
        color: var(--muted);
        flex: none;
        font-variant-numeric: tabular-nums;
        /* Wide enough for the longest age, so the hover buttons can be parked
           clear of it at a fixed offset. */
        min-width: 32px;
        text-align: right;
      }

      /* Weight, not alarm red. A third of a real board is past the stale
         threshold, and a session going quiet is the thing this board exists to
         show rather than something that has gone wrong. Red that common stops
         being read. */
      .age.stale { color: var(--fg); font-weight: 500; }

      .sub {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        margin-top: 3px;
        margin-left: calc(var(--mark) + var(--mark-gap));
        overflow: hidden;
      }

      /* The ellipsis has to live on the text, not on the row holding it: a flex
         container ignores `text-overflow`, so every one of these lines used to
         be chopped off mid-word with nothing to say it had been. */
      .sub .label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sub.parked { color: var(--waiting); cursor: text; }
      .sub.cwd { color: var(--muted); font-family: var(--mono); }

      .icon { flex: none; opacity: 0.75; }

      /* Between the name and the age. `relative` so the popover hangs off it,
         and `flex: none` so a long name shortens instead of squeezing it. */
      .pin {
        position: relative;
        flex: none;
        width: 14px;
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
        line-height: 16px;
        text-align: center;
        border-radius: 3px;
      }

      .row:hover .pin { color: var(--fg); }
      .pin.missing .icon { text-decoration: line-through; }
      /* Both beat `.row:hover { cursor: grab }`. The popover is inside the pin,
         so clicking anywhere on it opens the file and it inherits the pointer;
         the directory pin opens nothing, so it says so. */
      .pin[role='button'] { cursor: pointer; }
      .pin:not([role='button']) { cursor: default; }

      .popover {
        display: none;
        position: absolute;
        /* Anchored to its right edge so it opens back across the row. Hung off
           the left it would start near the right edge and run off the page. */
        right: 0;
        top: calc(100% + 4px);
        /* Above the rows it overlaps, the action bar of the row below (drawn on
           its own background) and the sticky toolbar, which all sit at 2. */
        z-index: 3;
        width: max-content;
        max-width: 320px;
        background: var(--bg);
        border: 1px solid var(--hairline);
        border-radius: 5px;
        box-shadow: 0 3px 10px rgb(0 0 0 / 25%);
        padding: 6px 8px;
        text-align: left;
      }

      /* The pin is 14px wide and the card opens below it, so a pointer heading
         for the card leaves the pin before it arrives and the popover closes
         under it. This fills that band, the full width of the card, so the
         whole path across is still inside the pin. Invisible, and only present
         while the popover is. */
      .popover::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: -20px;
        height: 20px;
      }

      .pin:hover .popover,
      .pin:focus-visible .popover { display: block; }

      .popover-title { color: var(--fg); font-size: 11px; }
      .popover-path {
        color: var(--muted);
        font-size: 10px;
        margin-top: 2px;
        /* A path is the one thing here that has no length limit, so it wraps
           rather than being cut: this popover exists to show it in full. */
        overflow-wrap: anywhere;
      }

      .actions {
        position: absolute;
        /* 12px row padding, 32px of age, 14px of pin, two 8px gaps. How long a
           session has sat is the reason to reach for these buttons, so the age
           stays readable while the pointer is on the row, and the pin stays
           pointable on the hover that draws these. */
        right: 72px;
        top: 4px;
        display: none;
        gap: 3px;
        background: var(--hover);
        padding-left: 6px;
      }

      /* `focus-within` is what makes the row reachable without a mouse: tabbing
         into a row reveals the same bar hovering it does, so a keyboard does not
         land on buttons that are invisible. */
      .row:hover .actions,
      .row:focus-within .actions { display: flex; }

      .actions button {
        background: var(--bg);
        border: 1px solid var(--faint);
        color: var(--muted);
        border-radius: 4px;
        font-size: 10px;
        /* 24px tall, which is the smallest a pointer target should be. The type
           stays at 10px; the height comes from the padding. */
        min-height: 24px;
        line-height: 1;
        padding: 0 7px;
        cursor: pointer;
        font-family: inherit;
      }

      .actions button:hover:not(:disabled) { color: var(--fg); border-color: var(--fg); }
      /* The only button that takes something away, and it looked exactly like
         the two that do not. */
      .actions button.remove:hover { color: var(--danger); border-color: var(--danger); }
      /* Not a decoy: a running session cannot be resumed, so the button that
         would do it says so by being visibly out of reach rather than by
         answering a click with a complaint. */
      .actions button:disabled { opacity: 0.45; cursor: not-allowed; }

      input.edit,
      select.edit {
        font: inherit;
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--ready);
        border-radius: 3px;
        padding: 0 4px;
      }

      /* The header suppresses selection so a click reads as collapse, which
         would otherwise leave the rename field unselectable. */
      .group-header input.edit { width: 14ch; user-select: text; }

      /* The second press on a group's ×. It asks in words, so it is wider than
         the × and reads as the answer to a question rather than another way in.
         It carries `edit` for the repaint guard, which is why it is styled down
         here beside the fields rather than beside the × itself. */
      button.group-delete.edit { color: var(--danger); border-color: var(--danger); }

      /* The panel the group header's `+` opens. It sits between the header and
         the group's rows, which is where the row it is about to make will
         appear. */
      .start-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 12px 8px;
        padding: 8px;
        /* A hairline, not `--ready`: that blue means "just went idle" on every
           row, and a panel wearing it reads as a status. */
        border: 1px solid var(--hairline);
        border-top: none;
        border-radius: 0 0 4px 4px;
        font-size: 11px;
      }

      .start-panel input.edit {
        font-size: 11px;
        /* The 24px the buttons beside them already keep. */
        min-height: 24px;
      }

      /* Drawn over the border rather than outside it, so a focused field is one
         ring instead of a blue border inside a blue halo. */
      .start-panel input.edit:focus-visible {
        outline: 2px solid var(--ready);
        outline-offset: -1px;
      }

      /* Back to a native-sized box: `input.edit` sizes text fields, and a
         checkbox stretched to `width: 100%` inside a blue border was the
         loudest thing on a panel meant to be quiet. */
      .start-panel input.edit[type='checkbox'] {
        width: auto;
        flex: none;
        min-height: 0;
        border: none;
        padding: 0;
        margin: 0;
        accent-color: var(--fg);
      }

      .start-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Never shrinks: as a shrinkable flex item it gave its width to the
         buttons and broke "create a progress file" across three lines. */
      .start-check {
        display: flex;
        align-items: center;
        flex: none;
        gap: 5px;
        white-space: nowrap;
        color: var(--muted);
        cursor: pointer;
      }

      /* Both buttons to the right, away from the checkbox, with `start` last so
         the panel reads left to right as option, way out, action. */
      .start-actions > button:first-of-type { margin-left: auto; }

      .start-actions button {
        background: var(--bg);
        border: 1px solid var(--faint);
        color: var(--muted);
        border-radius: 4px;
        font: inherit;
        min-height: 24px;
        padding: 0 9px;
        cursor: pointer;
      }

      .start-actions button:hover:not(:disabled) { color: var(--fg); border-color: var(--ready); }
      .start-actions button:disabled { cursor: default; color: var(--faint); }

      /* Filled, alone on the panel: `start` is what the panel is for, and an
         outline shared with `cancel` made the two read as the same offer. */
      .start-actions .start-go {
        background: var(--ready);
        border-color: var(--ready);
        color: var(--bg);
        font-weight: 600;
      }

      .start-actions .start-go:hover:not(:disabled) { color: var(--bg); opacity: 0.88; }

      .start-actions .start-go:disabled {
        background: var(--bg);
        border-color: var(--faint);
        color: var(--faint);
      }

      /* Empty until there is something to say, so it takes no room on a panel
         that is going well. */
      .start-answer:empty { display: none; }
      .start-answer { color: var(--muted); }

      .edit-line { margin-top: 3px; margin-left: 14px; font-size: 11px; }
      .edit-line .pending { color: var(--muted); }
      .edit-line input.edit,
      .edit-line select.edit { font-size: 11px; }

      #drawer > .group { border-top: 1px solid var(--hairline); margin-top: 16px; }
      #drawer .group-header { color: var(--muted); }

      #empty {
        padding: 20px 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      code { font-family: var(--mono); color: var(--fg); }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <span>Oldest first</span>
      <!-- Empty while the stream is up, so a board that is live says nothing. -->
      <span id="offline"></span>
      <span id="count"></span>
    </div>
    <div id="board"></div>
    <div id="drawer"></div>
    <!-- Shared by every "start a session" panel, and outside the part `render`
         rebuilds so a panel does not have to carry its own copy. -->
    <datalist id="board-repos"></datalist>

    <script type="module">
      import { start } from '/board.js'

      start()
    </script>
  </body>
</html>
